upstream backend_pewcorder_web {
    server 127.0.0.1:8003;
}

# Certbot will add the HTTPS server block and rewrite this to redirect.
# When updating the live SSL server block, keep the /share/ proxy location
# and include gzip.conf there too.
server {
    listen 80;
    listen [::]:80;
    server_name pewcorder.benlocher.com;

    include /etc/nginx/snippets/pewcorder-gzip.conf;

    add_header X-Debug-Site pewcorder-web always;

    root /var/www/pewcorder.benlocher.com/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        etag on;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Share pages need server-rendered Open Graph tags for iMessage / Slack / etc.
    location ^~ /share/ {
        proxy_pass http://backend_pewcorder_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.pewcorder.benlocher.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
