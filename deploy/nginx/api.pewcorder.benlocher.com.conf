upstream backend_pewcorder {
    server 127.0.0.1:8003;
}

map $http_origin $pewcorder_audio_cors_origin {
    default "";
    "https://pewcorder.benlocher.com" $http_origin;
    "capacitor://localhost" $http_origin;
    "http://localhost" $http_origin;
}

# Certbot will add the HTTPS server block and rewrite this to redirect.
# When updating the live SSL server block, include gzip.conf there too.
server {
    listen 80;
    listen [::]:80;
    server_name api.pewcorder.benlocher.com;

    include /etc/nginx/snippets/pewcorder-gzip.conf;

    add_header X-Debug-Site pewcorder-api always;

    client_max_body_size 500m;
    client_body_buffer_size 128k;

    location = / {
        return 302 https://pewcorder.benlocher.com/;
    }

    location /static/ {
        alias /var/www/api.pewcorder.benlocher.com/backend/staticfiles/;
        autoindex off;
        try_files $uri $uri/ =404;
        expires 7d;
        etag on;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Django authorizes signed audio URLs, then delegates byte-range delivery
    # here with X-Accel-Redirect. Nginx's static module is reliable on iOS.
    location ^~ /_protected_sermon_audio/ {
        internal;
        alias /var/www/api.pewcorder.benlocher.com/backend/media/;
        autoindex off;
        types {
            audio/mp4 m4a mp4;
            audio/mpeg mp3;
            audio/aac aac;
            audio/ogg ogg oga;
            audio/webm webm;
            audio/wav wav;
            audio/x-caf caf;
            audio/3gpp 3gp 3gpp;
        }
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin $pewcorder_audio_cors_origin always;
        add_header Access-Control-Expose-Headers
            "Accept-Ranges, Content-Length, Content-Range, Content-Type" always;
        add_header Vary Origin always;
    }

    location / {
        proxy_pass http://backend_pewcorder;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
