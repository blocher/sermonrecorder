# Shared compression settings for Pewcorder nginx sites.
# Include inside each server block (HTTP and HTTPS).

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/woff
    font/woff2
    application/font-woff
    application/font-woff2;
